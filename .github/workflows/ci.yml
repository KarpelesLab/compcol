name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      # `--features all` is every algorithm in its standard build; `embed`
      # is a mode that swaps the deflate family for its small variants, so
      # it gets a run of its own below rather than hiding the standard
      # codecs behind `--all-features`.
      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --features all -- -D warnings

      - name: Test (all features)
        run: cargo test --features all

      - name: Clippy (all features + embed, warnings denied)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features + embed)
        if: runner.os == 'Linux'
        run: cargo test --all-features

  no_std:
    name: no_std builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build bare no_std (no default features, no alloc)
        run: cargo build --no-default-features

      - name: Build no_std with RLE only (alloc-free algorithm)
        run: cargo build --no-default-features --features rle

      - name: Build no_std with every algorithm feature
        run: cargo build --no-default-features --features all

      # `all` pulls in `std`, which hides codecs that only build with it
      # (brotli once called the std-only `f32::log2`). Build every
      # algorithm again on `alloc` alone.
      - name: Build every algorithm on alloc without std
        run: >-
          cargo build --no-default-features --features
          alloc,factory,rle,rle90,deflate,deflate64,zlib,gzip,lzma,xz,lzma2,zstd,brotli,lz4,lz5,snappy,lzw,lzss,bzip2,lzo,lzf,lzx,amiga_lzx,quantum,lzfse,adc,ppmd,xpress_huffman,lznt1,xpress,packbits,zip_implode,lzs,lzham,sit13,lzah,arsenic,rar1,rar2,rar3,rar5,zip_shrink,zip_reduce,lha,bcj,bcj2,delta,arc_crunch,arc_squeeze,arc_squash,hpack,qpack,huffman,rangecoder,mtf,bwt,checksum

      - name: Build no_std embed deflate family (no alloc)
        run: cargo build --no-default-features --features embed,deflate,zlib,gzip

      - name: Build no_std embed deflate family for Cortex-M
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build --target thumbv7em-none-eabi --no-default-features --features embed,deflate,zlib,gzip

      - name: Test embed deflate family without alloc
        run: |
          cargo test --no-default-features --features embed,deflate,zlib,gzip \
            --test embed --test embed_flate_roundtrip --test embed_flate_compress --test embed_flate_push --test embed_flate_embedding

  msrv:
    # Builds on the oldest supported toolchain, read from `rust-version` in
    # Cargo.toml so the job follows MSRV bumps without editing this file.
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check (all features, all targets)
        run: cargo check --all-targets --all-features

      - name: Check bare no_std (no default features, no alloc)
        run: cargo check --no-default-features

  narrow_clippy:
    # Catches dead-code lint regressions in the shared bits/checksum/huffman
    # modules when only a non-deflate-family feature is enabled. (We hit this
    # during the algorithm-by-algorithm landing; CI guards against
    # reintroducing it.)
    name: Clippy on a narrow feature subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy (lz4 only, warnings denied)
        run: cargo clippy --no-default-features --features lz4 --all-targets -- -D warnings

      - name: Clippy (zstd only, warnings denied)
        run: cargo clippy --no-default-features --features zstd --all-targets -- -D warnings

      - name: Clippy (embed + gzip only, warnings denied)
        run: cargo clippy --no-default-features --features embed,gzip --all-targets -- -D warnings

      - name: Clippy (embed alone, warnings denied)
        run: cargo clippy --no-default-features --features embed --all-targets -- -D warnings

  embed_footprint:
    # Guards the sizes `compcol::embed` documents: builds a bare-metal
    # thumbv7em-none-eabi binary around each embed codec and fails if its
    # code, stack or static RAM exceeds the ceiling, if any panic machinery
    # gets linked, or if the codec `static` leaves `.bss`. The table lands
    # in the job summary.
    name: Embed footprint (code size, stack, no panics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
          components: llvm-tools

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/footprint

      - name: Measure
        run: tools/footprint/check.sh | tee -a "$GITHUB_STEP_SUMMARY"

  embed_crosscheck:
    # The embed and standard builds of the deflate family must read each
    # other's streams: compress with one CLI build, decompress with the
    # other, both ways, for gzip, zlib and raw deflate.
    name: Embed cross-check against the standard codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: crosscheck

      - name: Cross-check
        run: tools/embed-crosscheck.sh | tee -a "$GITHUB_STEP_SUMMARY"

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --features all
        run: cargo doc --no-deps --features all

      - name: cargo doc --no-deps --all-features (embed)
        run: cargo doc --no-deps --all-features

  docsrs:
    name: Docs build (docs.rs config)
    runs-on: ubuntu-latest
    env:
      # Mirror the docs.rs build environment so a docs.rs-only failure is
      # caught here rather than only after publishing. docs.rs builds on
      # nightly and passes `--cfg docsrs` (see [package.metadata.docs.rs] in
      # Cargo.toml); the plain `docs` job above runs on stable without
      # `--cfg docsrs`, so the `#[cfg_attr(docsrs, doc(cfg(...)))]` labels are
      # inert there and a missing crate-root `feature(doc_cfg)` slips through.
      RUSTDOCFLAGS: --cfg docsrs -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (nightly, as docs.rs uses)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --features all (docs.rs config)
        run: cargo doc --no-deps --features all
